# El ecualizador de sistema de VasakOS: diez bandas delante de la salida por
# omisión.
#
# ── Qué es ──────────────────────────────────────────────────────────────────
#
# Un `filter-chain` dentro del propio demonio de PipeWire, con un biquad
# `bq_peaking` por banda (31 Hz … 16 kHz, una octava cada uno, Q = √2) y un
# `bq_highshelf` con `Freq = 0` adelante, que es una ganancia plana: el margen
# que evita que una banda subida sature. Los valores de acá son los de arranque
# —todo en 0 dB, transparente— y quien los cambia es el módulo de WirePlumber
# `libwireplumber-module-vasak-equalizer`, que guarda lo que eligió la persona y
# lo vuelve a poner cada vez que este nodo aparece.
#
# ── Por qué en el demonio y no en un proceso aparte ─────────────────────────
#
# Cargado acá, el filtro corre en el mismo hilo de tiempo real que el resto del
# grafo: no hay un proceso más que despertar en cada ciclo, y si WirePlumber se
# reinicia el audio sigue pasando por el filtro con los valores que tenía.
#
# ── Por qué sigue solo a la salida ──────────────────────────────────────────
#
# Por `filter.smart`. Es la política de filtros de WirePlumber 0.5
# (`linking/find-filter-target.lua`, `linking/get-filter-from-target.lua`): a
# un filtro inteligente **sin destino** se le mandan los flujos que iban a la
# salida por omisión, y su propia salida va a la salida por omisión. Cuando
# ésta cambia —unos auriculares Bluetooth que se conectan, otra salida elegida
# en el panel— WirePlumber reengancha todo, y el filtro nunca queda apuntando a
# la anterior. Además `find-best-default-node.lua` no elige nunca un filtro
# inteligente como salida por omisión, así que el ecualizador no se roba ese
# lugar.
#
# Apagarlo no es poner todo en 0: es `filter.smart.disabled = true` en el
# metadato `filters`, que lo hace el módulo. Con eso WirePlumber desengancha el
# filtro y los flujos van directo al dispositivo.
#
# ── Lo que no cubre ─────────────────────────────────────────────────────────
#
# · Un flujo que **eligió** una salida concreta (moverlo a mano en un mezclador)
#   no pasa por el ecualizador: el filtro no tiene destino propio, y la
#   política sólo lo pone delante de lo que va «a la salida por omisión».
# · Es estéreo. Una salida 5.1 recibe lo ecualizado mezclado a dos canales.
#
# Los nombres de los nodos (`eq_31` … `eq_16k`, `preamp`) y de los dos nodos del
# filtro (`vasak-equalizer`, `vasak-equalizer.output`) los usa el módulo para
# encontrarlo; una prueba comprueba que coincidan con su tabla.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "VasakOS Equalizer"
      media.name       = "VasakOS Equalizer"
      filter.graph = {
        nodes = [
          { type = builtin name = preamp label = bq_highshelf
            control = { "Freq" = 0.0 "Q" = 1.0 "Gain" = 0.0 } }
          { type = builtin name = eq_31 label = bq_peaking
            control = { "Freq" = 31.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_63 label = bq_peaking
            control = { "Freq" = 63.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_125 label = bq_peaking
            control = { "Freq" = 125.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_250 label = bq_peaking
            control = { "Freq" = 250.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_500 label = bq_peaking
            control = { "Freq" = 500.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_1k label = bq_peaking
            control = { "Freq" = 1000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_2k label = bq_peaking
            control = { "Freq" = 2000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_4k label = bq_peaking
            control = { "Freq" = 4000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_8k label = bq_peaking
            control = { "Freq" = 8000.0 "Q" = 1.41 "Gain" = 0.0 } }
          { type = builtin name = eq_16k label = bq_peaking
            control = { "Freq" = 16000.0 "Q" = 1.41 "Gain" = 0.0 } }
        ]
        links = [
          { output = "preamp:Out" input = "eq_31:In" }
          { output = "eq_31:Out"  input = "eq_63:In" }
          { output = "eq_63:Out"  input = "eq_125:In" }
          { output = "eq_125:Out" input = "eq_250:In" }
          { output = "eq_250:Out" input = "eq_500:In" }
          { output = "eq_500:Out" input = "eq_1k:In" }
          { output = "eq_1k:Out"  input = "eq_2k:In" }
          { output = "eq_2k:Out"  input = "eq_4k:In" }
          { output = "eq_4k:Out"  input = "eq_8k:In" }
          { output = "eq_8k:Out"  input = "eq_16k:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "vasak-equalizer"
        media.class = Audio/Sink
        filter.smart = true
        filter.smart.name = "vasak-equalizer"
      }
      playback.props = {
        node.name    = "vasak-equalizer.output"
        # Pasivo: si nadie suena, el filtro no mantiene despierto al
        # dispositivo, y la salida se puede suspender como sin ecualizador.
        node.passive = true
        stream.dont-remix = true
      }
    }
  }
]
