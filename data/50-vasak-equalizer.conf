# El módulo `equalizer`, que viene **encendido**.
#
# Busca el filtro que carga PipeWire desde `60-vasak-equalizer.conf`, le pone
# las ganancias que eligió la persona —guardadas en
# `~/.local/state/vasak/equalizer.ini`— y publica `org.vasak.Equalizer` en el
# bus de la sesión, que es por donde el escritorio y Ajustes lo cambian.
#
# Seguir a la salida por omisión no es cosa de este módulo: lo hace la política
# de filtros de WirePlumber, porque el filtro se declara `filter.smart`. Por
# eso pide `metadata.filters`, que es el metadato donde se lo apaga.
#
# ── Si algo dejó de funcionar ───────────────────────────────────────────────
#
#     WIREPLUMBER_DEBUG=m-vasak-equalizer:4 systemctl --user restart wireplumber
#     journalctl --user -u wireplumber -f | grep m-vasak-equalizer
#
# Para apagarlo en un equipo sin desinstalar nada, un archivo propio en
# `/etc/wireplumber/wireplumber.conf.d/` o en
# `~/.config/wireplumber/wireplumber.conf.d/`:
#
#     wireplumber.profiles = { main = { custom.vasak-equalizer = disabled } }
#
# Apagado el módulo, el filtro sigue delante de la salida —lo carga PipeWire—
# y, desde el próximo reinicio de PipeWire, plano, que es transparente (medido:
# el mismo nivel, al milésimo de dB, que sin el filtro). Para sacarlo del
# camino sin apagar el módulo alcanza con apagar el ecualizador desde Ajustes.
wireplumber.components = [
  {
    name = libwireplumber-module-vasak-equalizer, type = module
    provides = custom.vasak-equalizer
    requires = [ metadata.filters ]
  }
]

wireplumber.profiles = {
  main = {
    custom.vasak-equalizer = required
  }
}
