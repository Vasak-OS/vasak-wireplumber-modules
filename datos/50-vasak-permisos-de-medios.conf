# El módulo `permisos-de-medios`, que viene **encendido**.
#
# ── Qué hace ────────────────────────────────────────────────────────────────
#
# Le pregunta a `vasak-permissions` por cada cliente de PipeWire que se conecta
# —nombrándolo por su pid, que es lo único que el cliente no puede ni falsear
# ni elegir— y le oculta los objetos de cámara al que no tenga permiso.
#
# Es lo que cierra lo que el socket no cierra: la etapa anterior dejó de
# ofrecer la cámara por `pipewire-0` y mandó al portal por `pipewire-0-priv`,
# pero elegir el socket privilegiado lo puede hacer cualquiera, y la regla era
# «todos o el portal» y no «ésta sí y ésta no».
#
# ── Por qué recién ahora ────────────────────────────────────────────────────
#
# Viajó apagado desde que se empaquetó, y no por prudencia genérica: faltaba la
# otra mitad de la regla del escritorio, que es que **todo lo que se bloquea se
# tiene que poder desbloquear**. El módulo niega a quien no tenga decisión
# guardada, y una aplicación que nunca preguntó no figura en Privacidad y
# seguridad — no había interruptor que mover ni aviso que ofreciera ponerlo.
#
# Desde `vasak-permissions` 0.14.0 esa mitad existe: una consulta sin decisión
# **anota el intento** —con lo que la aplicación aparece en la pantalla de
# permisos— y **avisa una vez**, que es cuando la persona sabe qué estaba
# haciendo. Por eso el paquete pide esa versión y no una anterior: contra el
# servicio viejo esto volvería a bloquear sin decir nada.
#
# ── Si algo dejó de funcionar ───────────────────────────────────────────────
#
# Primero, mirar qué decidió:
#
#     WIREPLUMBER_DEBUG=m-vasak-medios:4 systemctl --user restart wireplumber
#     journalctl --user -u wireplumber -f | grep m-vasak-medios
#
# Y para apagarlo en un equipo sin desinstalar nada, un archivo propio en
# `/etc/wireplumber/wireplumber.conf.d/` o en
# `~/.config/wireplumber/wireplumber.conf.d/`:
#
#     wireplumber.profiles = { main = { custom.vasak-permisos-de-medios = disabled } }
#
wireplumber.components = [
  {
    name = libwireplumber-module-vasak-permisos-de-medios, type = module
    provides = custom.vasak-permisos-de-medios
  }
]

wireplumber.profiles = {
  main = {
    custom.vasak-permisos-de-medios = required
  }
}
