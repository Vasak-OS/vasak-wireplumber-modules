# Acá no se llama al workflow compartido de la organización.
#
# Ese está hecho para las aplicaciones: mira `package.json`, `Cargo.toml`,
# biome, `vue-tsc`. Este repositorio no tiene nada de eso —es C con meson— y
# llamarlo sería pedirle que comprobara archivos que no existen.
#
# El módulo en sí —`modulo.c`— sí se compila, pero no en el runner de este
# workflow: necesita los encabezados de WirePlumber 0.5, y los runners son de
# Ubuntu. Lo compila el trabajo `compilar-modulo`, dentro de un contenedor de
# Arch, donde están los de 0.5. Antes no se compilaba en ninguna parte de este
# workflow y sólo aparecía al armar el paquete, en Arch, por el paquete de
# Arch: un error de API o de tipo sólo se veía ahí, y a quien le tocara.
# No se deja un paso que lo intente y se perdone si falla: un paso que no puede
# fallar no comprueba nada y hace creer que sí. Hay una excepción a esta regla,
# y está escrita donde está el paso: el de cobertura, que es lo único que este
# workflow sube y por lo tanto no puede dejar de subir.
#
# Lo que sí se comprueba es lo único que decide algo: `camara.c`,
# `decisiones.c`, `identidad.c` y `servicio.c`. Están separados del enganche con
# WirePlumber justamente para esto — no incluyen ni un encabezado de `wp/`, así
# que compilan y corren con glib pelado.
#
# La lista de abajo está escrita a mano y ya se apartó una vez de
# `pruebas/meson.build`. Lo que corresponde es correr `meson test`; mientras tanto
# está en los dos lados y hay que cambiar en los dos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    # Sólo lectura: clona, compila y corre pruebas. No comenta, no etiqueta, no
    # publica.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar glib
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: Compilar y correr las pruebas
        run: |
          set -e
          for prueba in identidad camara servicio decisiones; do
            gcc -std=c11 -Wall -Wextra -Werror \
              $(pkg-config --cflags glib-2.0) \
              -I src/permisos-de-medios \
              -o "pruebas-$prueba" \
              "pruebas/$prueba.c" \
              src/permisos-de-medios/camara.c \
              src/permisos-de-medios/decisiones.c \
              src/permisos-de-medios/identidad.c \
              src/permisos-de-medios/servicio.c \
              $(pkg-config --libs glib-2.0)
            "./pruebas-$prueba"
          done

  # ── compilar-modulo ───────────────────────────────────────────────────────
  #
  # `modulo.c` es el único archivo de este repositorio que incluye `<wp/wp.h>` y
  # `<pipewire/permission.h>`, y hasta ahora no lo compilaba ningún trabajo de
  # este workflow. Es la mitad del módulo: los otros cuatro archivos **deciden**,
  # están probados y compilan con glib pelado; éste es el que los engancha al
  # gestor de permisos de WirePlumber. Un error de API, una firma que cambió, un
  # tipo — nada de eso lo veía nadie hasta que alguien armaba el paquete en Arch.
  #
  # ── Por qué un contenedor de Arch y no un rodeo en Ubuntu ────────────────
  #
  # Porque no hay rodeo. La API que usa el módulo es la 0.5, y en `noble` —en
  # `main` y en `universe`— `apt` sólo ofrece `libwireplumber-0.4-dev`.
  # Compilar contra 0.4 sería compilar contra una versión que este módulo no usa
  # y no decir nada sobre la que sí usa, que es peor que no compilar: verde por
  # la versión equivocada. Arch trae 0.5, así que la dependencia se resuelve en
  # vez de esquivarse, y lo que se compila acá son los encabezados contra los
  # que se empaqueta.
  #
  # El contenedor corre en el runner de `ubuntu-latest` y no en una máquina
  # propia: la imagen es de otra distribución, el runner es el de siempre.
  #
  # ── Por qué va aparte y no dentro de `pruebas` ────────────────────────────
  #
  # Por la misma razón que la cobertura va en su propio trabajo, y está escrita
  # más abajo en este archivo: las reglas de `main` de este repositorio exigen
  # `pruebas` y nada más. Un problema acá —que una imagen de Arch se mueva, que
  # un paquete cambie de nombre, que aparezca una advertencia nueva— no puede
  # frenar un merge, porque este trabajo no es una puerta. Ese es también el
  # riesgo que se acepta: si este trabajo se rompe, nadie se entera hasta que
  # vuelve a compilar, y sólo se entera quien mire.
  #
  # ── Qué NO es esto ────────────────────────────────────────────────────────
  #
  # No mide nada. Compilar no es ejecutar, y acá no hay ni un PipeWire ni una
  # sesión: `modulo.c` sigue con 0% de cobertura y va a seguir con 0%, y eso no
  # lo cambia este trabajo. Por lo tanto no compila con `--coverage`, no sube
  # ningún informe y no está en ninguna propiedad de Sonar: un trabajo llamado
  # como la cobertura que reporta 0% sería peor que no tener trabajo, por la
  # misma razón que el paso de cobertura no deja pasar un informe vacío como si
  # fuera una medición. Lo que compra es más angosto y es real: **el módulo
  # compila contra la versión de WirePlumber con la que se despacha, en cada PR**,
  # y no sólo cuando alguien empaqueta.
  #
  # ── `meson`, y no otro bucle de gcc ───────────────────────────────────────
  #
  # `meson setup` y `meson compile` sobre el `meson.build` de la raíz, que es el
  # que arma el `shared_module` de verdad desde `modulo.c` y resuelve
  # `decisiones_dep` y la dependencia `wireplumber-0.5`. El trabajo `pruebas`
  # compila con un `for` escrito a mano que ya se apartó una vez de
  # `pruebas/meson.build`; agregar un tercer camino para armar el mismo módulo
  # sería el mismo error por tercera vez. Lo que este trabajo agrega no es una
  # forma de compilar, es un sistema donde compilar.
  #
  # `-Dwerror=true` es la opción de meson que pasa `-Werror`, y `-Wall -Wextra`
  # ya vienen de `warning_level=2` en el `meson.build` de la raíz: la línea que
  # compila `modulo.c` queda con los mismos `-Wall -Wextra -Werror` que usa
  # `pruebas`, y no uno más flojo. Que este archivo nunca se había sostenido a
  # ese estándar no es razón para bajarlo; si aparece una advertencia, es un
  # hallazgo y se arregla, no se silencia.
  compilar-modulo:
    runs-on: ubuntu-latest
    container: archlinux
    # Sólo lectura: clona e instala paquetes en un contenedor efímero. No
    # comenta, no etiqueta, no publica.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Instalar lo que meson necesita
        run: |
          set -e
          # La imagen `archlinux` es pelada: no trae compilador, ni meson, ni
          # pkg-config, ni los encabezados. Se instala lo mínimo, y cada
          # paquete está acá por una razón:
          #
          #  · `gcc` — el compilador. No viene en la imagen.
          #  · `meson`, `ninja`, `pkgconf` — el sistema de compilación y el
          #    que resuelve los `.pc`. `meson` depende de `ninja`, pero se
          #    nombra igual: que funcione por una dependencia transitiva es
          #    frágil y no dice qué necesita este trabajo.
          #  · `libwireplumber` — los encabezados de 0.5 y el
          #    `wireplumber-0.5.pc`. **No** `wireplumber`: ese paquete trae
          #    el daemon, lua, systemd y pipewire, y el módulo no usa nada de
          #    eso. Los encabezados están en el que dice «lib».
          #  · `glib2` — los encabezados y el `glib-2.0.pc` que necesita la
          #    biblioteca estática `decisiones`, que sí es parte del módulo.
          #    `libwireplumber` no lo trae: depende de las bibliotecas
          #    compartidas de glib, no de las de desarrollo.
          #
          # `-Syu` y no `-Sy`: con la base de datos de una imagen que envejece,
          # instalar sin actualizar primero es una actualización parcial, que
          # no está soportada y falla de maneras que no dicen nada de este
          # repositorio. Cuesta unos segundos más por corrida y evita que un
          # redibujo de la imagen rompa el trabajo.
          pacman -Syu --noconfirm --needed \
            gcc meson ninja pkgconf glib2 libwireplumber

      - name: Compilar el módulo
        run: |
          set -e
          # Va a aparecer un WARNING de meson diciendo que no existe
          # `/usr/lib/wireplumber-0.5`. Es lo esperado acá y no es un fallo:
          # `meson.build` avisa cuando el directorio de módulos no está, y
          # `/usr/lib/wireplumber-0.5` lo crea el paquete `wireplumber`, que
          # este contenedor no instala a propósito. `meson setup` sale con 0
          # igual, y el aviso se deja ver en vez de taparlo: instalar
          # `wireplumber` para callar un warning sería meter el daemon entero
          # en el contenedor para curar una línea de log.
          meson setup build -Dwerror=true
          meson compile -C build

      # Las ocho pruebas no dependen de WirePlumber y ya las corre `pruebas`, así
      # que no son el objeto de este trabajo y no se las corre dos veces para
      # fingir que se midió algo. Salen gratis porque `meson compile` ya las
      # construyó, y lo que miran es que el `meson.build` que usa este trabajo
      # siga construyendo las que el `for` de `pruebas` no construye: el mismo
      # archivo que ya se apartó una vez de esa lista escrita a mano.
      - name: Las pruebas de meson, de paso
        run: meson test -C build

  # ── SonarQube Cloud ──────────────────────────────────────────────────────
  #
  # Este es el trabajo que faltaba, y falta por una razón que ya está escrita
  # arriba: este repositorio no llama al workflow compartido, así que tampoco
  # heredaba su `sonar`. Lo que pasó es que el análisis quedó congelado el 24 de
  # septiembre con doce hallazgos en el panel que ya estaban arreglados en
  # `main` —seguían ahí no porque estuvieran abiertos, sino porque nada volvía
  # a leer el repositorio—. Este trabajo es lo que los va a cerrar.
  #
  # Sin `SONAR_TOKEN` se saltea y lo dice, en vez de fallar: un PR desde un fork
  # no recibe secretos.
  #
  # `modulo.c` no se compila acá, y no es una omisión: necesita los encabezados
  # de WirePlumber 0.5, que no existen en los repositorios de Ubuntu. Los
  # compila el trabajo `compilar-modulo`, dentro de un contenedor de Arch, pero
  # **compilar no es medir**: de acá sigue sin salir cobertura suya y la
  # cobertura honesta de ese archivo sigue siendo 0%. Queda fuera de la
  # cobertura, y por eso cualquier cambio suyo va a Reprobar la puerta de
  # código nuevo mientras siga sin pruebas. Es un dato, no un error: la
  # cobertura dice la verdad sobre lo que está probado.
  sonar:
    runs-on: ubuntu-latest
    # Lo único que hace esto es leer el repositorio y mandar el análisis. No
    # comenta, no etiqueta, no publica.
    permissions:
      contents: read
    steps:
      - name: Hay token
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin SONAR_TOKEN: se saltea el análisis. Hay que pasarlo en «secrets»."
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.token.outputs.hay == 'true'
        with:
          persist-credentials: false
          # Sonar asigna cada línea a su commit para saber qué es código nuevo,
          # y para eso necesita el historial entero.
          fetch-depth: 0

      - name: Instalar glib
        if: steps.token.outputs.hay == 'true'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      # ── La cobertura ─────────────────────────────────────────────────────
      #
      # Va en este trabajo y no en `pruebas` por lo mismo que va aparte en el
      # workflow compartido: las reglas de `main` de este repositorio exigen
      # `pruebas` y nada más, así que un problema de cobertura acá no puede
      # frenar un merge. Cuesta correr las pruebas dos veces, en paralelo.
      #
      # glib pelado alcanza: los cuatro archivos que se compilan acá no incluyen
      # ni un encabezado de `wp/`, que es la razón por la que `modulo.c` queda
      # afuera. Son los mismos cuatro que compila `pruebas`.
      #
      # ── Por qué este paso no puede cortar la corrida ─────────────────────
      #
      # Arriba, en la cabeza de este archivo, está escrito que «un paso que no
      # puede fallar no comprueba nada y hace creer que sí». Este paso es
      # deliberadamente la excepción, y la razón es que el modo de falla está
      # al revés.
      #
      # Aquello protege una comprobación: si se traga un fallo, algo roto pasa
      # por verificado, y eso es un falso verde. Acá, en cambio, un fallo duro
      # en la cobertura significa que **no hay análisis**, y la ausencia de
      # análisis es exactamente la ceguera que este PR vino a arreglar: es lo
      # que dejó los doce hallazgos dos días en el panel después de estar
      # arreglados. Un paso de cobertura que puede tumbar el análisis se sabotea
      # a sí mismo.
      #
      # Lo que este paso sí hace es no mentir: si gcovr no está, si falla, o si
      # el informe no nombra ningún archivo de producción, avisa con un
      # `::warning::` que lo dice de frente y sigue. Y avisa *antes* de seguir,
      # no después. La diferencia entre esto y un verde falso es que el verde
      # falso no dice nada.
      #
      # La cobertura, además, no es el objeto del trabajo: el objeto es el
      # análisis. Lo que la cobertura compra es que la puerta pueda cerrarse
      # alguna vez, y eso se cierra con pruebas nuevas, no con un paso más
      # estricto.
      - name: Cobertura
        if: steps.token.outputs.hay == 'true'
        run: |
          # Sin `set -e`, y a propósito: ver la nota de arriba.
          set -uo pipefail

          destino=build/cobertura
          rm -rf "$destino"
          mkdir -p "$destino"
          problemas=0

          for prueba in identidad camara servicio decisiones; do
            dir="$destino/$prueba"
            mkdir -p "$dir"

            # Un subdirectorio por prueba y un objeto por archivo, en vez de un
            # binario por prueba. Las dos cosas importan y las dos son invisibles
            # mientras no se pida cobertura.
            #
            # El subdirectorio, porque las cuatro pruebas compilan los mismos
            # cuatro fuentes: juntos en un directorio, los `.gcda` de una pisan
            # los de otra y gcov dice «no coincide la marca con el fichero de
            # notas».
            #
            # El objeto por archivo, porque `pruebas/camara.c` y
            # `src/permisos-de-medios/camara.c` se llaman igual —los cuatro pares
            # se llaman igual— y gcc deriva el nombre del `.gcno` del nombre del
            # archivo. Los dos caían en `pruebas-camara-camara.gcno`, el segundo
            # pisaba al primero, y gcov reportaba 0% para todo sin decir por
            # qué. Compilando por separado los nombres ya no se chocan.
            #
            # `--coverage` tiene que estar en la compilación **y** en el enlazado:
            # sin él en el enlazado no queda nada que ejecute el contador.
            gcc -std=c11 -Wall -Wextra -Werror --coverage \
              $(pkg-config --cflags glib-2.0) \
              -I src/permisos-de-medios \
              -c -o "$dir/pruebas-$prueba.o" "pruebas/$prueba.c" || problemas=1
            for fuente in camara decisiones identidad servicio; do
              gcc -std=c11 -Wall -Wextra -Werror --coverage \
                $(pkg-config --cflags glib-2.0) \
                -I src/permisos-de-medios \
                -c -o "$dir/$fuente.o" "src/permisos-de-medios/$fuente.c" || problemas=1
            done
            gcc --coverage -o "$dir/pruebas-$prueba" "$dir"/*.o \
              $(pkg-config --libs glib-2.0) || problemas=1
            # Si una de las compilaciones falló, el binario puede no existir o
            # ser de la corrida anterior: correrlo y reportar su cobertura sería
            # medir algo que no se acaba de compilar.
            if [ -x "$dir/pruebas-$prueba" ] && [ "$problemas" -eq 0 ]; then
              "$dir/pruebas-$prueba" || problemas=1
            fi
          done

          if [ "$problemas" -ne 0 ]; then
            # Que el archivo exista aunque esté vacío. Un informe que falta y
            # un informe vacío dan lo mismo en el panel —0%— pero el vacío al
            # menos es un archivo que se puede ver, y acá el paso decide dejar
            # uno para que la causa quede a la vista en vez de ser un 0% que
            # parece una medición. El 0% sigue siendo la cifra honesta: no se
            # midió nada porque no se pudo medir.
            printf "<?xml version='1.0' encoding='utf-8'?>\n<coverage version=\"1\"/>\n" > "$destino/coverage.xml"
            echo "::warning::Alguna prueba no compiló o no pasó; la cobertura sale incompleta o no sale. El rojo de las pruebas lo marca el trabajo «pruebas», que es donde corresponde. Sonar va a ver 0% de cobertura, y ese 0% no es una medición."
            exit 0
          fi

          # gcovr clavado a la versión, por lo mismo que las acciones van clavadas
          # al commit: lo que se baja acá se ejecuta, y `pipx run` es la misma
          # forma que ya usa el `zizmor` del workflow compartido.
          #
          # `--sonarqube` y no `--lcov`: para C no existe
          # `sonar.cfamily.lcov.reportPaths`. Las propiedades que la familia C
          # acepta son llvm-cov, vscoveragexml, gcov, bullseye, cobertura y
          # `sonar.coverageReportPaths`, que es el formato genérico de Sonar y es
          # lo que usa el ejemplo oficial de SonarSource para gcovr. Con un lcov
          # y una propiedad inventada, Sonar no habría dicho nada y la cobertura
          # habría entrado como 0%: verde por la razón equivocada, que es
          # justamente lo que este trabajo vino a arreglar.
          #
          # `--root` y `--object-directory` apuntan al repositorio y a la
          # carpeta que contiene los subdirectorios de cada prueba. El `--filter`
          # deja la cobertura de `pruebas/` fuera: los archivos de prueba se
          # clasifican como prueba y su cobertura no se mira, y contarla acá
          # sólo agranda el informe.
          estado=0
          pipx run gcovr==8.6 \
            --root . \
            --object-directory "$destino" \
            --filter 'src/' \
            --sonarqube "$destino/coverage.xml" || estado=$?

          if [ "$estado" -ne 0 ]; then
            # Mismo criterio que arriba: el archivo se escribe igual, vacío, para
            # que lo que Sonar encuentre no sea un 0% sin explicación sino un 0%
            # con un archivo a la vista y un aviso que lo dice de frente.
            printf "<?xml version='1.0' encoding='utf-8'?>\n<coverage version=\"1\"/>\n" > "$destino/coverage.xml"
            echo "::warning::gcovr no pudo terminar (salió con $estado); no hay cobertura que subir. El análisis sigue igual: sin esto la puerta de código nuevo va a Reprobar, y con esto tal vez no. Sonar va a ver 0% de cobertura, y ese 0% no es una medición."
            exit 0
          fi

          # Un `gcovr` cuyo filtro no matchea nada igual escribe un informe
          # válido y vacío y sale con 0. El archivo está, dice 0% en todas
          # partes y no dispara ningún error: es peor que no tener informe,
          # porque parece una medición. Por eso se mira que haya archivos *de
          # producción* y no solamente que el archivo exista.
          medidos=$(grep -c 'file path="src/' "$destino/coverage.xml" || true)
          # `|| true` deja a `medidos` vacío si el `grep` falla por sí mismo, y
          # en bash `[ "" -eq 0 ]` sale con 2 en vez de 0: la guarda no
          # dispararía justo en el caso que existe para atrapar.
          medidos=${medidos:-0}
          if [ "$medidos" -eq 0 ]; then
            echo "::warning::El informe de cobertura no nombra ningún archivo de src/. Es un informe vacío y NO es una medición de 0%: se sube igual, pero la cobertura de este PR no quiere decir nada."
            exit 0
          fi

          echo "Cobertura de las fuentes que hoy se compilan (modulo.c queda afuera a propósito):"
          # Se imprimen los números y no sólo el «se generó»: un paso que dice
          # que midió sin decir qué midió es el mismo problema del informe
          # vacío, un renglón más arriba.
          python3 - "$destino/coverage.xml" <<'RESUMEN'
          import sys, xml.etree.ElementTree as ET
          total = cubiertas = 0
          for f in ET.parse(sys.argv[1]).getroot():
              lineas = f.findall('lineToCover')
              ok = sum(1 for l in lineas if l.get('covered') == 'true')
              total += len(lineas); cubiertas += ok
              print(f"  {f.get('path')}: {ok}/{len(lineas)}")
          print(f"  total: {cubiertas}/{total}")
          RESUMEN

      - name: Análisis
        if: steps.token.outputs.hay == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # La clave del proyecto sigue la forma que usa SonarQube Cloud al
          # importar desde GitHub, que es la que ya tienen los proyectos de
          # antes.
          #
          # `src` es el código y `pruebas` son las pruebas, dicho explícito acá
          # en vez de por exclusiones: las pruebas de este repositorio están en
          # `pruebas/` y no en `tests/`, así que los patrones del workflow
          # compartido no las alcanzarían. `**/pruebas/**` se comprobó contra las
          # seis rutas del directorio y las seis entran.
          #
          # Declararlas como pruebas no es un detalle: si no, Sonar las cuenta
          # como código sin probar —nadie prueba las pruebas— y la cobertura del
          # código nuevo se hunde justo en el PR que más pruebas suma. Los nueve
          # hallazgos de shell que se arreglaron en `pruebas/*.sh` caen en este
          # bando: se reclasifican, y es el análisis volviendo a leer `main` lo
          # que los cierra.
          #
          # Un archivo no puede estar en las dos listas, así que `pruebas` va
          # también en las exclusiones del código. Acá es redundante —`src` ya
          # no lo alcanza— y se deja igual para que el día que alguien abra
          # `sonar.sources` a `.` no termine con el mismo archivo en las dos.
          #
          # `modulo.c` no se excluye de la cobertura, y es a propósito. Se
          # podría, y la puerta quedaría más fácil de cerrar, pero eso sería
          # comprar un verde midiendo menos: el archivo está sin probar y el
          # informe tiene que decir que está sin probar.
          #
          # El informe va en el formato genérico de Sonar y no en lcov, por lo
          # que dice el paso de cobertura más arriba.
          args: >
            -Dsonar.organization=vasakos
            -Dsonar.projectKey=Vasak-OS_${{ github.event.repository.name }}
            -Dsonar.sources=src
            -Dsonar.tests=pruebas
            -Dsonar.exclusions=**/pruebas/**,**/build/**
