# El módulo `permisos-de-medios`, y por qué viene **apagado**.
#
# ── Qué haría si se enciende ────────────────────────────────────────────────
#
# Le pregunta a `vasak-permissions` por cada cliente de PipeWire que se conecta
# —nombrándolo por su pid, que es lo único que el cliente no puede ni falsear
# ni elegir— y le oculta los objetos de cámara al que no tenga permiso.
#
# ── Por qué no viene encendido ──────────────────────────────────────────────
#
# Porque falta la otra mitad de la regla del escritorio: **todo lo que se
# bloquea se tiene que poder desbloquear**.
#
# Hoy el módulo niega a quien no tenga una decisión guardada, y una aplicación
# que nunca preguntó no tiene ninguna: no figura en Privacidad y seguridad, así
# que no hay interruptor que mover. Y la negación no genera aviso, así que
# tampoco llega la oferta de permitirla. Encenderlo así dejaría la cámara
# apagada para todo el mundo, sin nada que diga por qué ni cómo arreglarlo —
# que es exactamente la forma de fallar que este módulo existe para evitar.
#
# Lo que falta, en orden:
#
#   1. Que una negación del módulo genere aviso, como ya pasa con las que
#      escribe AppArmor, para que aparezca la oferta de permitir.
#   2. O que Privacidad y seguridad liste también las aplicaciones que todavía
#      no preguntaron, para que haya qué tocar antes de que pase nada.
#
# Con cualquiera de las dos, esto pasa a `required` y se enciende de fábrica.
#
# ── Mientras tanto ──────────────────────────────────────────────────────────
#
# Para encenderlo en un equipo, un archivo propio en
# `/etc/wireplumber/wireplumber.conf.d/` o en `~/.config/wireplumber/wireplumber.conf.d/`:
#
#     wireplumber.profiles = { main = { custom.vasak-permisos-de-medios = required } }
#
# Y para ver qué decide, sin que decida nada todavía:
#
#     WIREPLUMBER_DEBUG=m-vasak-medios:4 systemctl --user restart wireplumber
#     journalctl --user -u wireplumber -f | grep m-vasak-medios

wireplumber.components = [
  {
    name = libwireplumber-module-vasak-permisos-de-medios, type = module
    provides = custom.vasak-permisos-de-medios
  }
]

wireplumber.profiles = {
  main = {
    custom.vasak-permisos-de-medios = disabled
  }
}
